<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>DSH Relay 管理</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <script src="/admin/admin.js" defer></script>
  </head>
  <body>
    <header class="admin-bar">
      <div>
        <strong>DSH Relay</strong>
        <span>运行统计</span>
      </div>
      <div class="bar-actions">
        <span id="updated-at"></span>
        <button id="refresh" class="quiet hidden" type="button">刷新</button>
        <button id="logout" class="quiet hidden" type="button">退出</button>
      </div>
    </header>

    <main>
      <section id="login-view" class="login-view hidden">
        <form id="login-form">
          <h1>后台登录</h1>
          <p>使用 Relay 环境变量中配置的管理账号。</p>
          <label for="username">账号</label>
          <input id="username" name="username" autocomplete="username" required>
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <p id="login-error" class="error" role="alert"></p>
          <button class="primary" type="submit">登录</button>
        </form>
      </section>

      <section id="disabled-view" class="message-view hidden">
        <h1>后台尚未启用</h1>
        <p>在 Relay 环境中设置 <code>ADMIN_USERNAME</code> 和 <code>ADMIN_PASSWORD</code>，然后重新部署。</p>
      </section>

      <section id="dashboard-view" class="hidden">
        <div class="heading">
          <h1>使用概览</h1>
          <p>统计仅包含账号、设备与访问会话元数据。</p>
        </div>

        <div class="metric-grid" id="metrics">
          <article><span>用户总数</span><strong id="users-total">0</strong><small id="users-new">近 7 天 0</small></article>
          <article><span>近 30 天活跃用户</span><strong id="active-users">0</strong><small id="users-24h">近 24 小时新增 0</small></article>
          <article><span>已绑定电脑</span><strong id="devices-paired">0</strong><small id="devices-online">在线 0</small></article>
          <article><span>当前访问会话</span><strong id="sessions-active">0</strong><small id="sessions-24h">近 24 小时 0</small></article>
        </div>

        <section class="chart-section">
          <div class="section-heading">
            <div>
              <h2>最近 30 天</h2>
              <p>新用户与远程访问会话</p>
            </div>
            <div class="legend"><span class="user-key">新用户</span><span class="session-key">会话</span></div>
          </div>
          <canvas id="activity-chart" height="240" aria-label="最近 30 天新用户与会话折线图"></canvas>
        </section>

        <section class="sessions-section">
          <div class="section-heading">
            <div>
              <h2>最近访问</h2>
              <p>最多显示 50 条，不记录 DSH 内容。</p>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>用户</th><th>电脑</th><th>平台</th><th>开始时间</th><th>最后活动</th><th>状态</th></tr></thead>
              <tbody id="session-rows"></tbody>
            </table>
            <p id="sessions-empty" class="table-empty hidden">还没有远程访问记录。</p>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
